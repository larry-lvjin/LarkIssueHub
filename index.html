<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigma 耳机 Bug Tracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">

  <header class="head">
    <h1>Sigma 耳机 Bug Tracker</h1>
    <div class="head-actions">
      <button id="refresh" type="button">刷新</button>
    </div>
  </header>

  <section class="cards">
    <article class="card accent-violet">
      <span class="card-label">总数</span>
      <strong id="cTotal" class="card-value">—</strong>
    </article>
    <article class="card accent-red">
      <span class="card-label">未解决</span>
      <strong id="cUnresolved" class="card-value">—</strong>
    </article>
    <article class="card accent-orange">
      <span class="card-label">重新打开</span>
      <strong id="cReopened" class="card-value">—</strong>
    </article>
    <article class="card accent-pink">
      <span class="card-label">未解决与重新打开占比</span>
      <strong id="cRatio" class="card-value">—</strong>
    </article>
  </section>

  <section class="panel">
    <h2>总数趋势</h2>
    <div class="chart-box"><canvas id="chartTotal"></canvas></div>
  </section>

  <section class="panel">
    <h2>未解决 / 重新打开趋势</h2>
    <div class="chart-box"><canvas id="chartOpen"></canvas></div>
  </section>

  <section class="panel">
    <h2>未解决占比趋势</h2>
    <div class="chart-box"><canvas id="chartRatio"></canvas></div>
  </section>

  <section class="panel">
    <h2>每日新增未解决</h2>
    <div class="chart-box"><canvas id="chartNew"></canvas></div>
  </section>

  <p id="meta" class="meta">数据加载中…</p>
  <p id="error" class="error" hidden></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
